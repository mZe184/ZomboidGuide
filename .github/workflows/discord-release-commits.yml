name: Discord - Release Commits

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (z.B. v0.1.8)"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build changelog and post to Discord forum (new thread)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/{1}', github.repository, inputs.tag) }}
          CURRENT_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK fehlt."
            exit 1
          fi

          if [ -z "${TAG:-}" ]; then
            echo "Kein Tag uebergeben (Release Event oder workflow_dispatch input)."
            exit 1
          fi

          REPO="${CURRENT_REPO}"
          TOKEN="${GH_TOKEN}"
          if [ -z "${TOKEN:-}" ]; then
            echo "Kein GitHub Token verfuegbar."
            exit 1
          fi

          PREV_TAG="$(curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            | jq -r '.[1].tag_name // empty')"

          if [ -z "${PREV_TAG}" ]; then
            NOTES="(Kein vorheriger Release im aktuellen Repo gefunden.)"
          else
            NOTES="$(curl -fsS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/compare/${PREV_TAG}...${TAG}" \
              | jq -r '.commits[].commit.message | split("\n")[0] | "- " + .' \
              | head -n 20)"

            if [ -z "${NOTES}" ] || [ "${NOTES}" = "null" ]; then
              NOTES="(Keine Commits gefunden zwischen ${PREV_TAG} und ${TAG})"
            fi
          fi

          CONTENT="Neuer Release: **${TAG}**\n${URL}\n\n${NOTES}"
          THREAD_NAME="Release ${TAG}"

          # Discord Limit fuer content ist 2000 Zeichen.
          if [ "${#CONTENT}" -gt 1900 ]; then
            CONTENT="${CONTENT:0:1900}\n..."
          fi

          PAYLOAD="$(jq -n \
            --arg content "$CONTENT" \
            --arg thread_name "$THREAD_NAME" \
            '{content:$content, thread_name:$thread_name}')"

          curl -fsS -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}"
