
name: Build and Publish Binary Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: Tag to build (e.g. v0.1.8). Leave empty to use latest v* tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve Version
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw "github.ref_name is empty."
          }

          $version = if ($raw.StartsWith("v")) { $raw.Substring(1) } else { $raw }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_TAG=$raw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Release version: $version (tag: $raw)"

      - name: Restore
        run: dotnet restore ZomboidGuide.sln

      - name: Build
        run: dotnet build ZomboidGuide.sln -c Release --no-restore

      - name: Publish App + Update Feed
        shell: pwsh
        run: |
          ./deployment/Build-Release.ps1 -Runtime "win-x64" -Configuration "Release" -Version "${env:APP_VERSION}"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer Artifacts
        shell: pwsh
        run: |
          $releaseDir = "artifacts/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            $fallbackIscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $fallbackIscc)) {
              throw "Inno Setup compiler (iscc) was not found."
            }
            $isccPath = $fallbackIscc
          }
          else {
            $isccPath = $iscc.Path
          }

          $sourceDir = (Resolve-Path "artifacts/publish/app").Path
          $outputDir = (Resolve-Path $releaseDir).Path

          & $isccPath `
            "/DMyAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "deployment/Installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed."
          }

          $installerFiles = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File
          if ($null -eq $installerFiles -or $installerFiles.Count -eq 0) {
            throw "No installer executable was created."
          }

          $hashLines = @()
          foreach ($installer in $installerFiles) {
            $hashLines += ("{0}  {1}" -f (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $installer.Name)
          }

          $hashLines | Set-Content -Path (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.APP_TAG }}
          name: ZomboidGuide ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/SHA256SUMS.txt

  discord:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Post Discord forum thread with release notes
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "Missing secret DISCORD_WEBHOOK"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          # Fetch release info (body + url)
          RELEASE_JSON="$(gh api "repos/${REPO}/releases/tags/${TAG}")"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          RELEASE_BODY="$(echo "$RELEASE_JSON" | jq -r '.body // ""')"

          export TAG RELEASE_URL RELEASE_BODY

          # Build Discord post content (single-line python => no indentation issues)
          CONTENT="$(python3 -c "import os; url=os.environ.get('RELEASE_URL','').strip(); tag=os.environ.get('TAG','').strip(); body=os.environ.get('RELEASE_BODY','').replace('\r\n','\n').strip(); header=f\"✅ **New Release:** {tag}\\n{url}\\n\\n**Release Notes:**\\n\"; max_len=1900; text=header+(body if body else '_(No release notes text found.)_'); text=(text[:max_len-20].rstrip()+'\\n… _(truncated)_') if len(text)>max_len else text; print(text)")"

          TITLE="ZomboidGuide ${TAG}"

          # Forum webhook => create new thread with first post
          JSON="$(jq -n --arg name "$TITLE" --arg content "$CONTENT" '{name:$name, content:$content}')"

          curl -sS -H "Content-Type: application/json" -d "$JSON" "$DISCORD_WEBHOOK"
